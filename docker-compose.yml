x-migrate: &migrate
  image: migrate/migrate:v4.18.1
  depends_on:
    postgres:
      condition: service_healthy
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # доступен только с самой машины
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"   # доступен только с самой машины
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # ---------- Миграции (golang-migrate), по одной на каждую базу ----------
  migrate-auth:
    <<: *migrate
    volumes:
      - ./auth-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?sslmode=disable", "up"]

  migrate-video:
    <<: *migrate
    volumes:
      - ./video-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_db?sslmode=disable", "up"]

  migrate-interaction:
    <<: *migrate
    volumes:
      - ./interaction-service/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/interaction_db?sslmode=disable", "up"]

  # ---------- Микросервисы ----------
  auth-service:
    build: ./auth-service
    environment:
      HTTP_ADDR: ":8081"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      TOKEN_TTL: 24h
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
    restart: unless-stopped

  video-service:
    build: ./video-service
    environment:
      HTTP_ADDR: ":8082"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/video_db?sslmode=disable
      REDIS_ADDR: redis:6379
      STORAGE_PATH: /data/videos
      MAX_UPLOAD_MB: "500"
      CACHE_TTL: 5m
      VIEWS_FLUSH_INTERVAL: 30s
      INTERACTION_SERVICE_URL: http://interaction-service:8083
    volumes:
      - videos:/data/videos
    depends_on:
      migrate-video:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  interaction-service:
    build: ./interaction-service
    environment:
      HTTP_ADDR: ":8083"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/interaction_db?sslmode=disable
      REDIS_ADDR: redis:6379
      CACHE_TTL: 10m
      VIDEO_SERVICE_URL: http://video-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      migrate-interaction:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build: ./api-gateway
    environment:
      HTTP_ADDR: ":8080"
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-change-me}
      AUTH_SERVICE_URL: http://auth-service:8081
      VIDEO_SERVICE_URL: http://video-service:8082
      INTERACTION_SERVICE_URL: http://interaction-service:8083
      RATE_LIMIT_PER_MINUTE: "300"
      WEB_DIR: /web
    volumes:
      - ./frontend:/web:ro       # фронтенд раздаёт сам gateway
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      - auth-service
      - video-service
      - interaction-service
    restart: unless-stopped

volumes:
  pgdata:
  videos:
