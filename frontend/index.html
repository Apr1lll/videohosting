<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Кадр — видеохостинг</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2316213A'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='%23E0457B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="#/" aria-label="Кадр, на главную">
      <span class="logo-mark" aria-hidden="true"></span>Кадр
    </a>

    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" name="q" placeholder="Найти видео" aria-label="Поиск видео" autocomplete="off">
      <button type="submit" aria-label="Искать">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </form>

    <nav class="userbar" id="userbar"></nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
